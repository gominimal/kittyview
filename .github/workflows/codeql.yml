name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly rescan so new CodeQL queries run against unchanged code.
    - cron: "31 7 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF results to code scanning

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: rust
          # The only build mode CodeQL supports for Rust.
          build-mode: none

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
