name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# No workflow-level permissions -- set per-job below

jobs:
  verify:
    # The v0.1.4 tag shipped binaries reporting 0.1.3, because Cargo.toml was
    # never bumped. Fail here rather than after six matrix builds.
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag matches Cargo.toml version
        # Skipped for workflow_dispatch, which has no tag to check against.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          crate=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version $crate"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches Cargo.toml $crate"

  build:
    needs: verify
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: linux-amd64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            name: linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-15
            name: macos-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: windows-amd64
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            name: windows-aarch64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install musl-tools
        if: contains(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../kittyview-${{ matrix.name }}.tar.gz kittyview

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/kittyview.exe -DestinationPath kittyview-${{ matrix.name }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kittyview-${{ matrix.name }}
          path: kittyview-${{ matrix.name }}.*

  release:
    # Deliberately not gated on the ref: a manual run needs to reach this job,
    # which is the only way to exercise the publish path. What the ref decides
    # is whether the result is published or left as a draft -- see below.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: kittyview-*

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: kittyview-*
          generate_release_notes: true
          # Only a v* tag publishes. A manual run lands in a draft, which is
          # visible to collaborators only and creates no tag, so the whole job
          # can be rehearsed without a release escaping.
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('dry-run-{0}', github.run_id) }}
          draft: ${{ github.ref_type != 'tag' }}
